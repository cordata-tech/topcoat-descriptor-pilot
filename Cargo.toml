[package]
name = "cordata-topcoat-pilot"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Does a screen descriptor survive the move from React to Topcoat? See NOTES.md."
repository = "https://github.com/cordata-tech/topcoat-descriptor-pilot"
publish = false

[dependencies]
topcoat = "0.6"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros"] }

# Answers NOTES.md Q4: the fixtures were swapped for a real Toasty model over
# SQLite, and no accessor in either descriptor had to change.
toasty = { version = "0.10", features = ["sqlite"] }
uuid = { version = "1", features = ["v7"] }
